[tool.pytest.ini_options]
testpaths = ["dialectica-agent/tests"]
pythonpath = ["dialectica-agent"]

[tool.ruff]
target-version = "py311"
src = ["dialectica-agent"]

[tool.ruff.lint]
# Keep CI focused on syntax-level and clearly undefined-name failures while
# legacy formatting is incrementally improved.
select = ["E9", "F63", "F7", "F82"]
